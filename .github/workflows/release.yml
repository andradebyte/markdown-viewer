name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dpkg-dev

      - name: Build
        run: make

      - name: Build .deb package
        run: ./packaging/debian/build-deb-manual.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: mdview_*.deb

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-winpthreads
            unzip

      - name: Download WebView2 SDK
        shell: powershell
        working-directory: windows
        run: powershell -ExecutionPolicy Bypass -File download-webview2.ps1

      - name: Build mdview.exe
        run: ./build-mingw.sh

      - name: Package (portable zip)
        shell: powershell
        run: |
          Compress-Archive -Path windows/mdview.exe, windows/WebView2Loader.dll -DestinationPath mdview-windows-x64.zip

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        working-directory: windows
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: mdview-setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: mdview-windows-x64.zip

  release:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
